name: android-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4
        with:
          repository: linlannet/dsh-java-mobile
          path: dsh-java-mobile

      - name: 下载 H5 制品
        uses: actions/download-artifact@v4
        with:
          name: h5-artifact
          path: artifact

      - name: 投递 H5 到 h5-dist
        run: |
          rm -rf dsh-java-mobile/h5-dist
          cp -R artifact/dsh-java-desktop/dist dsh-java-mobile/h5-dist

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,aarch64-apple-ios

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 初始化 Android 工程
        working-directory: dsh-java-mobile
        run: |
          npm ci
          npx tauri android init

      - name: 注入 Android 签名（可选）
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: dsh-java-mobile/src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: 构建 APK / AAB
        working-directory: dsh-java-mobile
        run: npx tauri android build

      - name: 包体检查（APK/AAB ≤ 30MB）
        run: |
          set -e
          find dsh-java-mobile/src-tauri/gen/android \( -name "*.apk" -o -name "*.aab" \) | while read -r f; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 31457280 ]; then
              echo "包体超限：$f"
              exit 1
            fi
          done

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: |
            dsh-java-mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            dsh-java-mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab